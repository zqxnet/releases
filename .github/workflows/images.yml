name: Images

# Publishes the container images of a release as packages of this
# repository, with the digests they were built with (the same image that ZQX
# runs), from the registry files attached to the release v<version>:
#   zqx-control-registry-image-linux-amd64.tar.gz -> ghcr.io/zqxnet/zqx-control:<version>
#   zqx-registry-image-linux-amd64.tar.gz         -> ghcr.io/zqxnet/zqx:<version>
# Each file is checked against its .sha256, and its manifest against the
# digest it names, before it is pushed (skopeo --preserve-digests). Started
# by the release (repository_dispatch "images"), or by hand for a version.
on:
  repository_dispatch:
    types: [ images ]
  workflow_dispatch:
    inputs:
      version:
        description: "A published version, for example 0.23.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the images
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Download and check the registry files
        run: |
          set -eu
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" \
            -p 'zqx-control-registry-image-linux-amd64.tar.gz' -p 'zqx-control-registry-image-linux-amd64.tar.gz.sha256' \
            -p 'zqx-registry-image-linux-amd64.tar.gz' -p 'zqx-registry-image-linux-amd64.tar.gz.sha256'
          sha256sum -c zqx-control-registry-image-linux-amd64.tar.gz.sha256 zqx-registry-image-linux-amd64.tar.gz.sha256
          for name in zqx-control zqx; do
            mkdir -p "$name.dir"
            tar -C "$name.dir" -xzf "$name-registry-image-linux-amd64.tar.gz"
            src=$(skopeo inspect --override-os linux --override-arch amd64 --format '{{index .Labels "org.opencontainers.image.source"}}' "dir:$name.dir")
            test "$src" = "https://github.com/$GITHUB_REPOSITORY"
            test "$(skopeo inspect --override-os linux --override-arch amd64 --format '{{index .Labels "org.opencontainers.image.version"}}' "dir:$name.dir")" = "$VERSION"
          done

      - name: Push to ghcr.io, digests kept
        run: |
          set -eu
          for name in zqx-control zqx; do
            ref="ghcr.io/zqxnet/$name:$VERSION"
            digest="sha256:$(sha256sum "$name.dir/manifest.json" | cut -d' ' -f1)"
            # The image is an OCI index (the image and its provenance): --all
            # pushes all of it, so the digest stays.
            skopeo copy -q --all --preserve-digests --dest-creds "$GITHUB_ACTOR:$GH_TOKEN" "dir:$name.dir" "docker://$ref"
            pushed="sha256:$(skopeo inspect --raw --creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://$ref" | sha256sum | cut -d' ' -f1)"
            test "$pushed" = "$digest"
            echo "$ref -> $digest"
            echo "- \`$ref\` → \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
